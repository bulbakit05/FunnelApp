<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сравнение воронок продаж</title>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0f1a;
            --surface: #131726;
            --surface2: #1a1f35;
            --border: rgba(255,255,255,0.07);
            --border-bright: rgba(255,255,255,0.14);
            --text: #e8ecf4;
            --text-dim: #7a8299;
            --text-muted: #4a5068;

            --f1: #4f8ef7;
            --f1-soft: rgba(79,142,247,0.12);
            --f1-glow: rgba(79,142,247,0.25);
            --f1-label: #93bbfd;

            --f2: #34d399;
            --f2-soft: rgba(52,211,153,0.12);
            --f2-glow: rgba(52,211,153,0.25);
            --f2-label: #6ee7b7;

            --f3: #f472b6;
            --f3-soft: rgba(244,114,182,0.12);
            --f3-glow: rgba(244,114,182,0.25);
            --f3-label: #f9a8d4;

            --gold: #fbbf24;
            --gold-soft: rgba(251,191,36,0.12);

            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Geologica', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 32px 24px 48px;
        }

        /* ── HEADER ── */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .page-header h1 {
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #e8ecf4 0%, #7a8299 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-header p {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-top: 6px;
            font-weight: 400;
        }

        /* ── ADD FUNNEL BUTTON ── */
        .controls-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 40px;
            border: 1.5px solid var(--border-bright);
            background: var(--surface);
            color: var(--text);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: -0.01em;
        }
        .btn:hover { background: var(--surface2); border-color: rgba(255,255,255,0.22); transform: translateY(-1px); }
        .btn-primary {
            background: var(--f1-soft);
            border-color: var(--f1);
            color: var(--f1-label);
        }
        .btn-primary:hover { background: rgba(79,142,247,0.2); }
        .btn-report {
            background: var(--gold-soft);
            border-color: var(--gold);
            color: var(--gold);
        }
        .btn-report:hover { background: rgba(251,191,36,0.2); }

        /* ── FUNNELS GRID ── */
        .funnels-grid {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--surface2) transparent;
        }

        /* ── SINGLE FUNNEL CARD ── */
        .funnel-card {
            flex: 0 0 320px;
            background: var(--surface);
            border-radius: 20px;
            border: 1.5px solid var(--border);
            padding: 22px 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            position: relative;
            transition: var(--transition);
            animation: fadeInUp 0.3s ease both;
        }
        @keyframes fadeInUp {
            from { opacity:0; transform: translateY(16px); }
            to   { opacity:1; transform: translateY(0); }
        }

        .funnel-card[data-color="0"] { border-color: rgba(79,142,247,0.3); }
        .funnel-card[data-color="1"] { border-color: rgba(52,211,153,0.3); }
        .funnel-card[data-color="2"] { border-color: rgba(244,114,182,0.3); }

        .funnel-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .funnel-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .color-0 .funnel-dot { background: var(--f1); box-shadow: 0 0 8px var(--f1-glow); }
        .color-1 .funnel-dot { background: var(--f2); box-shadow: 0 0 8px var(--f2-glow); }
        .color-2 .funnel-dot { background: var(--f3); box-shadow: 0 0 8px var(--f3-glow); }

        .funnel-name-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            outline: none;
        }
        .funnel-name-input::placeholder { color: var(--text-muted); }

        .funnel-remove {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            transition: var(--transition);
            line-height: 1;
        }
        .funnel-remove:hover { color: #f87171; background: rgba(248,113,113,0.1); }

        /* ── STAGE ROWS ── */
        .stage-row {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .stage-bar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stage-bar-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .stage-bar-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .stage-bar-input {
            width: 72px;
            background: var(--surface2);
            border: 1px solid var(--border-bright);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            text-align: right;
            padding: 4px 8px;
            outline: none;
            transition: var(--transition);
            -moz-appearance: textfield;
        }
        .stage-bar-input::-webkit-outer-spin-button,
        .stage-bar-input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .stage-bar-input:focus {
            border-color: var(--f1);
            background: rgba(79,142,247,0.07);
        }
        .color-1 .stage-bar-input:focus { border-color: var(--f2); background: rgba(52,211,153,0.07); }
        .color-2 .stage-bar-input:focus { border-color: var(--f3); background: rgba(244,114,182,0.07); }

        .stage-bar-track {
            height: 8px;
            background: var(--surface2);
            border-radius: 99px;
            overflow: hidden;
        }
        .stage-bar-fill {
            height: 100%;
            border-radius: 99px;
            transition: width 0.35s cubic-bezier(0.4,0,0.2,1);
        }
        .color-0 .stage-bar-fill { background: linear-gradient(90deg, var(--f1), #93bbfd); }
        .color-1 .stage-bar-fill { background: linear-gradient(90deg, var(--f2), #6ee7b7); }
        .color-2 .stage-bar-fill { background: linear-gradient(90deg, var(--f3), #f9a8d4); }

        /* last stage (clients) gold */
        .stage-row.is-result .stage-bar-fill {
            background: linear-gradient(90deg, var(--gold), #fde68a) !important;
        }
        .stage-row.is-result .stage-bar-input {
            color: var(--gold);
        }
        .stage-row.is-result .stage-bar-label { color: var(--gold); opacity: 0.8; }

        /* ── CONVERSION BADGE BETWEEN STAGES ── */
        .conv-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 0 0 2px;
        }
        .conv-line {
            width: 2px; height: 18px;
            background: var(--border);
            border-radius: 99px;
            margin-left: 4px;
            flex-shrink: 0;
        }
        .conv-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--surface2);
            border: 1px solid var(--border-bright);
            border-radius: 40px;
            padding: 5px 12px;
            font-size: 0.78rem;
            color: var(--text-dim);
            font-weight: 500;
        }
        .conv-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
        }
        .conv-input {
            width: 52px;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            text-align: center;
            outline: none;
            -moz-appearance: textfield;
        }
        .conv-input::-webkit-outer-spin-button,
        .conv-input::-webkit-inner-spin-button { -webkit-appearance: none; }

        /* ── CALC MINI ── */
        .calc-mini {
            background: var(--surface2);
            border-radius: var(--radius-sm);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .calc-mini-title {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--text-dim);
        }
        .calc-mini-row {
            display: flex;
            gap: 8px;
        }
        .calc-mini-field {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .calc-mini-field label {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .calc-mini-field input {
            background: var(--surface);
            border: 1px solid var(--border-bright);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
            font-weight: 700;
            padding: 7px 9px;
            outline: none;
            transition: var(--transition);
            -moz-appearance: textfield;
        }
        .calc-mini-field input::-webkit-outer-spin-button,
        .calc-mini-field input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .calc-mini-field input:focus {
            border-color: var(--f1);
        }
        .color-1 .calc-mini-field input:focus { border-color: var(--f2); }
        .color-2 .calc-mini-field input:focus { border-color: var(--f3); }

        .calc-result-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
        }
        .calc-result-table td {
            padding: 4px 2px;
            color: var(--text-dim);
        }
        .calc-result-table td:last-child {
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: var(--text);
        }

        /* ── COMPARISON REPORT ── */
        .report-section {
            margin-top: 40px;
            background: var(--surface);
            border-radius: 20px;
            border: 1.5px solid var(--border-bright);
            padding: 28px 26px;
            display: none;
        }
        .report-section.visible { display: block; animation: fadeInUp 0.35s ease both; }

        .report-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .report-title {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: -0.03em;
        }
        .report-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: var(--transition);
        }
        .report-close:hover { color: var(--text); background: var(--surface2); }

        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }

        .report-metric {
            background: var(--surface2);
            border-radius: var(--radius);
            padding: 16px 18px;
            border: 1px solid var(--border);
        }
        .report-metric-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 12px;
        }
        .report-metric-bars {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .report-bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .report-bar-name {
            width: 90px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
        }
        .report-bar-track {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 99px;
            overflow: hidden;
        }
        .report-bar-fill {
            height: 100%;
            border-radius: 99px;
            transition: width 0.5s ease;
        }
        .rbar-0 { background: var(--f1); }
        .rbar-1 { background: var(--f2); }
        .rbar-2 { background: var(--f3); }

        .report-bar-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            font-weight: 700;
            width: 52px;
            text-align: right;
            flex-shrink: 0;
        }
        .rval-0 { color: var(--f1-label); }
        .rval-1 { color: var(--f2-label); }
        .rval-2 { color: var(--f3-label); }

        /* Comparison table */
        .report-table-wrap {
            overflow-x: auto;
        }
        .report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .report-table th {
            text-align: left;
            padding: 10px 12px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }
        .report-table td {
            padding: 11px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            color: var(--text-dim);
            font-weight: 500;
            vertical-align: middle;
        }
        .report-table tr:last-child td { border-bottom: none; }
        .report-table .metric-cell {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
        }
        .report-table .best { color: #4ade80; }
        .report-table .worst { color: #f87171; }

        .winner-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            background: rgba(74,222,128,0.12);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,0.3);
            margin-left: 6px;
        }

        .section-divider {
            height: 1px;
            background: var(--border);
            margin: 20px 0;
        }

        .insight-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .insight-card {
            flex: 1 1 200px;
            background: var(--surface2);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            border: 1px solid var(--border);
        }
        .insight-card .ins-label {
            font-size: 0.68rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .insight-card .ins-value {
            font-size: 1.1rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
        }
        .insight-card .ins-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        @media (max-width: 700px) {
            body { padding: 20px 12px 40px; }
            .funnel-card { flex: 0 0 285px; }
        }
    </style>
</head>
<body>

<div class="page-header">
    <h1>Воронки продаж</h1>
    <p>Несколько воронок — один сравнительный отчёт</p>
</div>

<div class="controls-bar">
    <button class="btn btn-primary" id="addFunnelBtn">＋ Добавить воронку</button>
    <button class="btn btn-report" id="reportBtn">📊 Сравнительный отчёт</button>
</div>

<div class="funnels-grid" id="funnelsGrid"></div>

<div class="report-section" id="reportSection">
    <div class="report-header">
        <span class="report-title">📊 Сравнительный отчёт</span>
        <button class="report-close" id="reportClose">✕</button>
    </div>
    <div id="reportContent"></div>
</div>

<script>
(function() {
    const STAGES = [
        { id: 's0', label: 'Звонки ≥30с', unit: 'зв.' },
        { id: 's1', label: 'Звонки ≥60с', unit: 'зв.' },
        { id: 's2', label: 'Звонки ≥2м',  unit: 'зв.' },
        { id: 's3', label: 'Звонки ≥3м',  unit: 'зв.' },
        { id: 's4', label: 'Клиенты',     unit: 'кл.', isResult: true }
    ];
    const COLORS = ['color-0', 'color-1', 'color-2'];
    const DEFAULTS = [[1375,931,443,301,10],[980,710,360,240,8],[1100,820,390,270,9]];

    let funnels = [];
    let funnelCounter = 0;

    const grid = document.getElementById('funnelsGrid');
    const reportSection = document.getElementById('reportSection');
    const reportContent = document.getElementById('reportContent');

    document.getElementById('addFunnelBtn').addEventListener('click', () => {
        if (funnels.length >= 3) {
            alert('Максимум 3 воронки для удобного сравнения');
            return;
        }
        const defaultIdx = funnels.length;
        addFunnel(`Воронка ${funnelCounter + 1}`, DEFAULTS[defaultIdx] || DEFAULTS[0]);
    });
    document.getElementById('reportBtn').addEventListener('click', buildReport);
    document.getElementById('reportClose').addEventListener('click', () => {
        reportSection.classList.remove('visible');
    });

    function addFunnel(name, values) {
        const id = funnelCounter++;
        const colorClass = COLORS[funnels.length % COLORS.length];
        const colorIdx = funnels.length % COLORS.length;

        const funnel = {
            id,
            name,
            colorClass,
            colorIdx,
            values: [...values],
            days: 15,
            targetClients: 4
        };
        funnels.push(funnel);
        renderFunnelCard(funnel);
        if (reportSection.classList.contains('visible')) buildReport();
    }

    function removeFunnel(id) {
        funnels = funnels.filter(f => f.id !== id);
        // recolor
        funnels.forEach((f, i) => {
            f.colorClass = COLORS[i % COLORS.length];
            f.colorIdx = i % COLORS.length;
        });
        grid.innerHTML = '';
        funnels.forEach(f => renderFunnelCard(f));
        if (reportSection.classList.contains('visible')) buildReport();
    }

    function renderFunnelCard(funnel) {
        const card = document.createElement('div');
        card.className = `funnel-card ${funnel.colorClass}`;
        card.dataset.color = funnel.colorIdx;
        card.dataset.fid = funnel.id;

        // Header
        const header = document.createElement('div');
        header.className = 'funnel-card-header';
        header.innerHTML = `
            <div class="funnel-dot"></div>
            <input class="funnel-name-input" type="text" value="${esc(funnel.name)}" placeholder="Название воронки">
            <button class="funnel-remove" title="Удалить">✕</button>
        `;
        card.appendChild(header);

        header.querySelector('.funnel-name-input').addEventListener('input', e => {
            funnel.name = e.target.value;
            if (reportSection.classList.contains('visible')) buildReport();
        });
        header.querySelector('.funnel-remove').addEventListener('click', () => removeFunnel(funnel.id));

        // Stages
        const stagesWrap = document.createElement('div');
        stagesWrap.style.display = 'flex';
        stagesWrap.style.flexDirection = 'column';
        stagesWrap.style.gap = '0';

        const stageInputEls = [];
        const convInputEls = [];

        STAGES.forEach((stage, i) => {
            if (i > 0) {
                const convRow = document.createElement('div');
                convRow.className = 'conv-row';
                const pct = calcConv(funnel.values[i-1], funnel.values[i]);
                convRow.innerHTML = `
                    <div class="conv-line"></div>
                    <div class="conv-badge">
                        Конв. <input type="number" class="conv-input" min="0" max="100" step="0.1" value="${pct}"> %
                    </div>
                `;
                const ci = convRow.querySelector('.conv-input');
                convInputEls.push(ci);
                ci.addEventListener('input', () => {
                    const pct = parseFloat(ci.value) || 0;
                    const newVal = Math.round((funnel.values[i-1] * pct) / 100);
                    funnel.values[i] = newVal;
                    stageInputEls[i].value = newVal;
                    updateBars(funnel, stageInputEls, convInputEls);
                    if (reportSection.classList.contains('visible')) buildReport();
                });
                stagesWrap.appendChild(convRow);
            } else {
                convInputEls.push(null);
            }

            const row = document.createElement('div');
            row.className = `stage-row${stage.isResult ? ' is-result' : ''}`;
            const pctFill = getBarPct(funnel.values[i], funnel.values);
            row.innerHTML = `
                <div class="stage-bar-wrap">
                    <div class="stage-bar-header">
                        <span class="stage-bar-label">${stage.label}</span>
                        <input type="number" class="stage-bar-input" min="0" step="1" value="${funnel.values[i]}">
                    </div>
                    <div class="stage-bar-track">
                        <div class="stage-bar-fill" style="width:${pctFill}%"></div>
                    </div>
                </div>
            `;
            const inp = row.querySelector('.stage-bar-input');
            stageInputEls.push(inp);
            inp.addEventListener('input', () => {
                funnel.values[i] = parseInt(inp.value) || 0;
                updateBars(funnel, stageInputEls, convInputEls);
                if (reportSection.classList.contains('visible')) buildReport();
            });
            stagesWrap.appendChild(row);
        });

        card.appendChild(stagesWrap);

        // Calc mini
        const calcMini = document.createElement('div');
        calcMini.className = 'calc-mini';
        calcMini.innerHTML = `
            <div class="calc-mini-title">🧮 Планирование</div>
            <div class="calc-mini-row">
                <div class="calc-mini-field">
                    <label>Дней</label>
                    <input type="number" min="1" value="${funnel.days}" step="1">
                </div>
                <div class="calc-mini-field">
                    <label>Целевых клиентов</label>
                    <input type="number" min="0" value="${funnel.targetClients}" step="1">
                </div>
            </div>
            <div class="calc-result-area"></div>
        `;
        const [daysInp, clInp] = calcMini.querySelectorAll('input');
        const resultArea = calcMini.querySelector('.calc-result-area');

        function updateCalc() {
            funnel.days = parseInt(daysInp.value) || 1;
            funnel.targetClients = parseInt(clInp.value) || 0;
            renderCalcResult(funnel, resultArea);
        }
        daysInp.addEventListener('input', updateCalc);
        clInp.addEventListener('input', updateCalc);
        updateCalc();

        card.appendChild(calcMini);
        grid.appendChild(card);
        funnel._stageInputEls = stageInputEls;
        funnel._convInputEls = convInputEls;
        funnel._calcResultArea = resultArea;
        funnel._daysInp = daysInp;
        funnel._clInp = clInp;
    }

    function updateBars(funnel, stageInputEls, convInputEls) {
        const max = Math.max(...funnel.values, 1);
        STAGES.forEach((_, i) => {
            stageInputEls[i].value = funnel.values[i];
            const pct = (funnel.values[i] / max) * 100;
            const fill = stageInputEls[i].closest('.stage-row').querySelector('.stage-bar-fill');
            if (fill) fill.style.width = pct + '%';
            if (convInputEls[i]) {
                convInputEls[i].value = calcConv(funnel.values[i-1], funnel.values[i]);
            }
        });
        if (funnel._calcResultArea) renderCalcResult(funnel, funnel._calcResultArea);
    }

    function renderCalcResult(funnel, area) {
        const clients = funnel.values[funnel.values.length - 1];
        const target = funnel.targetClients;
        const days = funnel.days;
        if (!clients || !target) { area.innerHTML = ''; return; }
        const ratio = target / clients;
        let html = `<table class="calc-result-table">`;
        STAGES.forEach((s, i) => {
            const total = Math.ceil(funnel.values[i] * ratio);
            const daily = Math.ceil(total / days);
            html += `<tr><td>${s.label}</td><td>${total} ${s.unit} / ${daily} в день</td></tr>`;
        });
        html += `</table>`;
        area.innerHTML = html;
    }

    function getBarPct(val, arr) {
        const max = Math.max(...arr, 1);
        return Math.max(2, (val / max) * 100);
    }

    function calcConv(from, to) {
        if (!from) return 0;
        return parseFloat(((to / from) * 100).toFixed(1));
    }

    function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── REPORT ──
    function buildReport() {
        if (funnels.length < 2) {
            reportContent.innerHTML = `<div class="empty-state">Добавьте минимум 2 воронки для сравнения</div>`;
            reportSection.classList.add('visible');
            reportSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            return;
        }

        const metrics = funnels.map(f => {
            const v = f.values;
            const convs = [];
            for (let i = 0; i < v.length - 1; i++) convs.push(calcConv(v[i], v[i+1]));
            const totalConv = v[0] > 0 ? parseFloat(((v[v.length-1] / v[0]) * 100).toFixed(2)) : 0;
            const costPerClient = v[0] > 0 ? parseFloat((v[0] / Math.max(v[v.length-1],1)).toFixed(1)) : 0;
            return { funnel: f, v, convs, totalConv, costPerClient };
        });

        const colorNames = ['#4f8ef7','#34d399','#f472b6'];

        // Build comparison bars per stage
        let metricsHtml = `<div class="report-grid">`;

        // Stage comparison bars
        STAGES.forEach((stage, si) => {
            const vals = metrics.map(m => m.v[si]);
            const maxVal = Math.max(...vals, 1);
            metricsHtml += `<div class="report-metric">
                <div class="report-metric-label">${stage.label}</div>
                <div class="report-metric-bars">`;
            metrics.forEach((m, mi) => {
                const pct = (m.v[si] / maxVal) * 100;
                metricsHtml += `<div class="report-bar-row">
                    <div class="report-bar-name" title="${esc(m.funnel.name)}">${esc(m.funnel.name)}</div>
                    <div class="report-bar-track"><div class="report-bar-fill rbar-${mi}" style="width:${pct}%"></div></div>
                    <div class="report-bar-val rval-${mi}">${m.v[si].toLocaleString()}</div>
                </div>`;
            });
            metricsHtml += `</div></div>`;
        });

        // Conversion stages
        for (let ci = 0; ci < STAGES.length - 1; ci++) {
            const label = `Конв. ${STAGES[ci].label} → ${STAGES[ci+1].label}`;
            const vals = metrics.map(m => m.convs[ci]);
            const maxVal = Math.max(...vals, 0.1);
            metricsHtml += `<div class="report-metric">
                <div class="report-metric-label">${label}</div>
                <div class="report-metric-bars">`;
            metrics.forEach((m, mi) => {
                const pct = (m.convs[ci] / maxVal) * 100;
                metricsHtml += `<div class="report-bar-row">
                    <div class="report-bar-name">${esc(m.funnel.name)}</div>
                    <div class="report-bar-track"><div class="report-bar-fill rbar-${mi}" style="width:${pct}%"></div></div>
                    <div class="report-bar-val rval-${mi}">${m.convs[ci]}%</div>
                </div>`;
            });
            metricsHtml += `</div></div>`;
        }

        metricsHtml += `</div>`;

        // Full conversion & efficiency
        const totalConvs = metrics.map(m => m.totalConv);
        const bestTotalIdx = totalConvs.indexOf(Math.max(...totalConvs));
        const worstTotalIdx = totalConvs.indexOf(Math.min(...totalConvs));
        const costVals = metrics.map(m => m.costPerClient);
        const bestCostIdx = costVals.indexOf(Math.min(...costVals));

        // Insights
        metricsHtml += `<div class="section-divider"></div>
        <div class="insight-cards">`;

        metrics.forEach((m, mi) => {
            metricsHtml += `<div class="insight-card">
                <div class="ins-label" style="color:${colorNames[mi]}">${esc(m.funnel.name)}</div>
                <div class="ins-value">${m.totalConv}%</div>
                <div class="ins-sub">Общая конверсия (звонки→клиенты)</div>
            </div>`;
        });
        metricsHtml += `</div>`;

        // Detailed table
        metricsHtml += `<div class="section-divider"></div>
        <div class="report-table-wrap"><table class="report-table">
        <thead><tr><th>Метрика</th>`;
        metrics.forEach((m, mi) => {
            metricsHtml += `<th style="color:${colorNames[mi]}">${esc(m.funnel.name)}</th>`;
        });
        metricsHtml += `</tr></thead><tbody>`;

        // Rows: each stage value
        STAGES.forEach((stage, si) => {
            metricsHtml += `<tr><td>${stage.label}</td>`;
            const vals = metrics.map(m => m.v[si]);
            const maxV = Math.max(...vals);
            const minV = Math.min(...vals);
            metrics.forEach((m, mi) => {
                let cls = 'metric-cell';
                let badge = '';
                if (m.v[si] === maxV && maxV !== minV) { cls += ' best'; badge = '<span class="winner-badge">▲ лучший</span>'; }
                else if (m.v[si] === minV && maxV !== minV) cls += ' worst';
                metricsHtml += `<td class="${cls}">${m.v[si].toLocaleString()} ${stage.unit}${badge}</td>`;
            });
            metricsHtml += `</tr>`;
        });

        // Conv rows
        for (let ci = 0; ci < STAGES.length - 1; ci++) {
            metricsHtml += `<tr><td>Конв. этап ${ci+1}→${ci+2}</td>`;
            const vals = metrics.map(m => m.convs[ci]);
            const maxV = Math.max(...vals);
            const minV = Math.min(...vals);
            metrics.forEach((m, mi) => {
                let cls = 'metric-cell';
                let badge = '';
                if (m.convs[ci] === maxV && maxV !== minV) { cls += ' best'; badge = '<span class="winner-badge">▲ лучший</span>'; }
                else if (m.convs[ci] === minV && maxV !== minV) cls += ' worst';
                metricsHtml += `<td class="${cls}">${m.convs[ci]}%${badge}</td>`;
            });
            metricsHtml += `</tr>`;
        }

        // Total conv
        metricsHtml += `<tr><td>Общая конверсия</td>`;
        metrics.forEach((m, mi) => {
            let cls = 'metric-cell';
            let badge = '';
            if (mi === bestTotalIdx && totalConvs.filter(v => v === totalConvs[bestTotalIdx]).length < funnels.length) {
                cls += ' best'; badge = '<span class="winner-badge">▲ лучший</span>';
            } else if (mi === worstTotalIdx && totalConvs.filter(v => v === totalConvs[worstTotalIdx]).length < funnels.length) {
                cls += ' worst';
            }
            metricsHtml += `<td class="${cls}">${m.totalConv}%${badge}</td>`;
        });
        metricsHtml += `</tr>`;

        // Calls per client (efficiency)
        metricsHtml += `<tr><td>Звонков на клиента</td>`;
        metrics.forEach((m, mi) => {
            let cls = 'metric-cell';
            let badge = '';
            if (mi === bestCostIdx && costVals.filter(v => v === costVals[bestCostIdx]).length < funnels.length) {
                cls += ' best'; badge = '<span class="winner-badge">▲ эффективнее</span>';
            }
            metricsHtml += `<td class="${cls}">${m.costPerClient}${badge}</td>`;
        });
        metricsHtml += `</tr>`;

        metricsHtml += `</tbody></table></div>`;

        reportContent.innerHTML = metricsHtml;
        reportSection.classList.add('visible');
        reportSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Init with 2 default funnels
    addFunnel('Воронка 1', DEFAULTS[0]);
    addFunnel('Воронка 2', DEFAULTS[1]);

})();
</script>
</body>
</html>
